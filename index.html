<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoviAI | Decentralized Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'movi-black': '#050505',
              'movi-dark': '#0a0a0a',
              'movi-green': '#14F195', // Solana Green
              'movi-purple': '#9945FF', // Solana Purple
              'movi-blue': '#19FB9B',
              'movi-gold': '#FFD700', // Cinema Gold
              'movi-red': '#E50914', // Red Carpet
              'surface': '#121212',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              script: ['Courier Prime', 'monospace'], // Screenplay font
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'spotlight': 'radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%)',
              'projector-beam': 'conic-gradient(from 225deg at 50% -20%, transparent 0deg, rgba(255, 255, 255, 0.08) 40deg, rgba(255, 255, 255, 0.2) 45deg, rgba(255, 255, 255, 0.08) 50deg, transparent 90deg)',
              'dust-pattern': 'radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px)',
            },
            animation: {
              'flicker': 'flicker 4s infinite',
              'flicker-fast': 'flicker 0.15s infinite',
              'projector': 'projector 8s ease-in-out infinite',
              'grain': 'grain 1s steps(4) infinite',
              'countdown-spin': 'spin 1s linear infinite',
              'zoom-in': 'zoomIn 20s ease-out forwards',
              'dust-float': 'dust 10s linear infinite',
              'dust-float-slow': 'dust 20s linear infinite reverse',
              'beam-swing': 'beamSwing 10s ease-in-out infinite',
            },
            keyframes: {
              flicker: {
                '0%, 100%': { opacity: 1 },
                '5%': { opacity: 0.85 },
                '10%': { opacity: 0.95 },
                '15%': { opacity: 0.6 },
                '20%': { opacity: 1 },
                '50%': { opacity: 0.95 },
                '80%': { opacity: 0.7 },
                '85%': { opacity: 0.9 },
                '90%': { opacity: 0.6 },
              },
              projector: {
                '0%, 100%': { opacity: 0.4, transform: 'scaleX(1)' },
                '50%': { opacity: 0.6, transform: 'scaleX(1.05)' },
              },
              dust: {
                '0%': { transform: 'translateY(0) translateX(0)' },
                '25%': { transform: 'translateY(-15px) translateX(15px)' },
                '50%': { transform: 'translateY(0) translateX(25px)' },
                '75%': { transform: 'translateY(15px) translateX(15px)' },
                '100%': { transform: 'translateY(0) translateX(0)' },
              },
              beamSwing: {
                '0%, 100%': { transform: 'rotate(-2deg)' },
                '50%': { transform: 'rotate(2deg)' },
              },
              grain: {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '10%': { transform: 'translate(-5%, -5%)' },
                '20%': { transform: 'translate(-10%, 5%)' },
                '30%': { transform: 'translate(5%, -10%)' },
                '40%': { transform: 'translate(-5%, 15%)' },
                '50%': { transform: 'translate(-10%, 5%)' },
                '60%': { transform: 'translate(15%, 0)' },
                '70%': { transform: 'translate(0, 10%)' },
                '80%': { transform: 'translate(-15%, 0)' },
                '90%': { transform: 'translate(10%, 5%)' },
              },
              zoomIn: {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              }
            }
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      .font-script {
        font-family: 'Courier Prime', monospace;
      }
      .gradient-text {
        background: linear-gradient(to right, #14F195, #9945FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gold-text {
        background: linear-gradient(to right, #FFD700, #FDB931);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glass-panel {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      /* Film Grain Overlay */
      .film-grain {
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        animation: grain 0.5s steps(3) infinite;
      }
      
      /* Dynamic Dust Particles */
      .dust-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px);
        background-size: 60px 60px;
        opacity: 0.6;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      
      .dust-layer-2 {
        background-size: 110px 110px;
        opacity: 0.3;
      }

      /* Ticket Perforation */
      .ticket-edge {
        mask-image: radial-gradient(circle at 2px 50%, transparent 2px, black 3px);
        mask-position: -2px;
        mask-size: 100% 10px;
        mask-repeat: repeat-y;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #14F195;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
